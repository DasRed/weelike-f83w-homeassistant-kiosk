name: Build image

# Builds the system image from the original GSI and src/ (tools/build_image.py).
#  - pull request: build and keep as an artifact (3 days)
#  - push a v* tag: build and publish as a GitHub release (this is what flash.sh downloads)
#  - manual: build, optionally publish as a release

on:
  pull_request:
    paths:
      - src/**
      - build/**
      - tools/build_image.py
      - .github/workflows/build-image.yml
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Image version and release tag, e.g. v9
        required: true
      release:
        description: Publish as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE: ${{ inputs.release }}
          PR: ${{ github.event.number }}
        run: |
          case "$EVENT" in
            push)              version="$GITHUB_REF_NAME"; release=true ;;
            workflow_dispatch) version="$INPUT_VERSION";   release="$INPUT_RELEASE" ;;
            *)                 version="pr$PR";            release=false ;;
          esac
          [[ "$version" =~ ^(v[0-9]+|pr[0-9]+)$ ]] || { echo "Invalid version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq e2fsprogs patch xz-utils

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ hashFiles('build/sources.json') }}

      - name: Build image
        run: python3 tools/build_image.py --version "${{ steps.v.outputs.version }}" --out out --xz

      - name: Result
        run: |
          ls -l out
          cat out/SHA256SUMS
          rm out/*.img

      - name: Upload artifact
        if: steps.v.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ steps.v.outputs.version }}
          path: out/
          retention-days: 3
          compression-level: 0

      - name: Publish release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gsi=$(jq -r .gsi.file build/sources.json)
          ha=$(jq -r .homeassistant.version build/sources.json)
          {
            echo "System image $VERSION for the Weelikeit F83W, built from commit $GITHUB_SHA."
            echo
            echo "- Base: \`$gsi\` (AndyYan)"
            echo "- Home Assistant Companion (minimal) $ha"
            echo
            echo "Flash with \`./flash.sh\` – the script downloads this release by itself."
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$VERSION" out/* --target "$GITHUB_SHA" --title "Image $VERSION" --notes-file notes.md
